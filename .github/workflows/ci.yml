name: CI

# Runs the full gateway test suite on every push to main and every pull
# request. The suite loads the real src/registry.json, so a registry edit
# that breaks a premise fails here before it can be deployed.
# Local equivalent (verified from a clean venv, 2026-11-12):
#   python3 -m venv /tmp/ci-venv
#   /tmp/ci-venv/bin/pip install -r src/requirements.txt pytest
#   /tmp/ci-venv/bin/python -m pytest tests/ -q

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt pytest

      - name: Run the test suite
        run: python -m pytest tests/ -q
