# LAN entry for v0.5.3 on 192.168.0.166:6075.
# Clients: OpenClaw VM102 (192.168.0.188), Hermes VM112 (192.168.0.114), n8n CT100 (192.168.0.28).
# /admin/* is reachable only from n8n (alert poller, daily summary).
worker_processes 1;
pid /var/run/nginx.pid;
events { worker_connections 256; }
http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_max_body_size 8m;
  proxy_read_timeout 180s;
  proxy_buffering off;              # streaming responses
  server {
    listen 6075;
    location /admin/ {
      allow 192.168.0.28;
      deny all;
      proxy_pass http://sovereign-router-v05:8080;
    }
    location / {
      allow 192.168.0.188;
      allow 192.168.0.114;
      allow 192.168.0.28;
      deny all;
      proxy_pass http://sovereign-router-v05:8080;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
