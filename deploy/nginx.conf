# Sovereign Router v0.5 — nginx reverse proxy (DEPLOY GATE: not deployed)
#
# Publishes the gateway on 192.168.0.166:6075 (see docker-compose.v05.yml)
# to exactly three LAN clients and nothing else:
#   192.168.0.188  VM102  — OpenClaw
#   192.168.0.114  VM112  — Hermes
#   192.168.0.28   CT100  — n8n / local registry host
# Everyone else is denied at the proxy, before the request reaches the
# gateway. Client API keys are still required by the gateway itself —
# this allowlist is network defence-in-depth, not authentication.
#
# Streaming: chat completions use SSE. Proxy buffering is OFF and timeouts
# are long so streamed text and buffered streamed tool calls (spec: Output
# validation and escalation) are never cut or coalesced by nginx.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;

    # Do not leak the nginx version.
    server_tokens off;

    # Temp paths under /tmp (tmpfs): the container runs as uid 101 with a
    # read-only rootfs and cap_drop ALL, so nginx cannot chown the default
    # /var/cache/nginx paths (deploy fix, 2026-11-02).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Agent prompts run 8–150 KB in tests and Hermes turns are large;
    # allow generous request bodies. The gateway enforces its own
    # allowlist / 413 contract (spec: Interfaces).
    client_max_body_size 10m;

    upstream sovereign_gateway {
        server gateway:6075;
        keepalive 32;
    }

    server {
        listen 8080;

        # --- Source allowlist: the whole point of this proxy ---
        allow 192.168.0.188;   # VM102 — OpenClaw
        allow 192.168.0.114;   # VM112 — Hermes
        allow 192.168.0.28;    # CT100 — n8n
	allow 192.168.0.92;    # CT1007 - 20CRM
        deny all;

        # Local health endpoint for the container healthcheck only.
        # It answers from nginx itself and never reaches the gateway.
        # (Still subject to the allowlist above for remote callers;
        # the Docker healthcheck originates from inside the container.)
        location = /nginx-health {
            access_log off;
            allow 127.0.0.1;
            deny all;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://sovereign_gateway;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Required for keepalive + clean SSE delivery.
            proxy_set_header Connection "";

            # --- SSE streaming support ---
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            send_timeout 3600s;

            # Tell any downstream intermediary not to buffer either.
            add_header X-Accel-Buffering no;
        }
    }
}
